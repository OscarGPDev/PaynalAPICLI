# Single API request — authenticates and verifies response structure
version: "1.0"
name: "Login"
request:
  method: "POST"
  url: "${BASE_URL}/api/auth/login"
  headers:
    Content-Type: "application/json"
  body: '{"email": "${EMAIL}", "password": "${PASSWORD}"}'
  timeout_ms: 10000

assert:
  status: 200
  json:
    "$.success": true
  json_type:
    "$.data.accessToken": "string"
