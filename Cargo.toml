[package]
name = "paynal"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dotenvy = "0.15"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
num_cpus = "1.16"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

colored = "2.1"
walkdir = "2.5"
chrono = "0.4"
jsonpath_lib = "0.3"




